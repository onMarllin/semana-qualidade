<script>
const SKIN=['#f3cba8','#dca47c','#b97c4e','#8e5b37','#5e3a22'];
const HAIR=['#2b1d14','#5a3a1e','#8a5a2b','#d9b25a','#141414','#b8b8b8'];
const LOOK={
  operador:{hel:'#f4f4f4',sh:'#c3cad1',pa:'#2b3b5e',st:1},
  preparador:{hel:'#f4f4f4',sh:'#c3cad1',pa:'#3b3b44',st:1,tool:'wrench'},
  lider:{hel:'#f4f4f4',sh:'#d04a42',pa:'#2b2f3a',tool:'board'},
  inspetor:{hel:'#f4f4f4',sh:'#8fdc98',pa:'#394451',tool:'board'},
  tecnico:{hel:'#f4f4f4',sh:'#4b535d',pa:'#2a2e35',st:1,tool:'wrench'},
  metrologista:{hel:null,sh:'#2f7a45',pa:'#34425a',tool:'caliper',glasses:1},
  empilhadeira:{hel:'#f4f4f4',sh:'#3f6fb5',pa:'#2b3b5e',st:1},
  comprador:{hel:'#f4f4f4',sh:'#f7f7f7',pa:'#2b2f3a',tie:'#2c5190',tool:'board'},
  rh:{hel:null,sh:'#1c2a4a',pa:'#2b2f3a',tool:'board'}
};
const PCOL={p400:['#3f6f9e','#6a98c6','#2c4f73'],p600:['#4d8a5c','#74b183','#356441'],p800:['#a4513b','#cc7a62','#76382a']};

// ---------- personagem 10x16 ----------
function drawGuy(c,X,Y,s,o){
  o=o||{};
  const L=LOOK[s.role]||LOOK.operador, lk=s.look||{sk:1,hc:0,hs:0};
  const sk=SKIN[lk.sk%5], hc=HAIR[lk.hc%6], fl=o.face===-1;
  const P=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(X+(fl?10-x-w:x),Y+y,w,h);};
  const K='#1b1420';
  // cabelo atrás / rabo
  if(lk.hs===3)P(8,3,1,3,hc);
  // cabeça
  P(2,3,6,4,sk);
  if(L.hel){P(3,0,4,1,L.hel);P(2,1,6,2,L.hel);P(1,2,8,1,L.hel);P(3,0,2,1,'#ffffff55');}
  else{P(3,0,4,1,hc);P(2,1,6,2,hc);}
  if(lk.hs!==2){P(2,3,1,1,hc);P(7,3,1,1,hc);}
  if(lk.hs===1){P(2,4,1,2,hc);P(7,4,1,2,hc);}
  const blink=o.blink;
  if(L.glasses){P(3,4,4,1,'#39424c');P(3,4,1,1,blink?sk:'#dfe7ee');P(6,4,1,1,blink?sk:'#dfe7ee');}
  else{P(3,4,1,1,blink?sk:K);P(6,4,1,1,blink?sk:K);}
  P(4,6,2,1,'#00000033');
  // corpo
  P(4,7,2,1,sk);P(2,7,2,1,L.sh);P(6,7,2,1,L.sh);
  P(2,8,6,4,L.sh);
  if(L.st)P(2,10,6,1,'#d4dde3');
  if(L.tie){P(4,8,2,1,L.tie);P(4,9,2,3,L.tie);P(4,11,2,1,'#1d3a6b');}
  // braços
  const up=o.work&&o.arm;
  if(up){P(1,6,1,3,L.sh);P(8,6,1,3,L.sh);P(1,5,1,1,sk);P(8,5,1,1,sk);}
  else{P(1,8,1,3,L.sh);P(8,8,1,3,L.sh);P(1,11,1,1,sk);P(8,11,1,1,sk);}
  // ferramenta
  if(L.tool==='board'&&!up){P(8,9,2,3,'#8a5a2b');P(9,9,1,2,'#f1ece0');}
  if(L.tool==='wrench'){if(up)P(8,3,1,3,'#aab4bd');else{P(9,9,1,3,'#aab4bd');P(8,12,2,1,'#aab4bd');}}
  if(L.tool==='caliper'&&!up){P(9,7,1,5,'#c9d3da');P(8,7,1,1,'#c9d3da');}
  // pernas
  P(2,12,6,1,'#241c18');
  if(o.walk&&o.step){P(2,13,2,2,L.pa);P(6,13,2,2,L.pa);P(1,15,3,1,K);P(6,15,3,1,K);}
  else{P(3,13,2,2,L.pa);P(5,13,2,2,L.pa);P(3,15,2,1,K);P(5,15,2,1,K);}
}

// ---------- prensa 26x34 ----------
function drawPressSm(c,x,y,p,t,spd){
  const F=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(x+a,y+b,w,h);};
  const [m,hi,sh]=PCOL[p.tipo];
  const big=p.tipo==='p800'?1:0;
  F(1,32,24,2,'#00000055');
  F(3,8,4,23,m);F(3,8,1,23,hi);F(6,8,1,23,sh);
  F(19,8,4,23,m);F(19,8,1,23,hi);F(22,8,1,23,sh);
  F(1-big,1,24+2*big,8,m);F(1-big,1,24+2*big,1,hi);F(1-big,8,24+2*big,1,sh);
  F(10,3,6,3,'#f2c230');F(11,4,4,1,'#8a6f1e');
  let s=0;
  if(p.st==='run'){const g=PRESSES[p.tipo].gpm*spd;const ph=(t/1000)*(Math.min(g,110)/60)*Math.PI*2;s=Math.round(6*(0.5-0.5*Math.cos(ph)));}
  else if(p.st==='setup'){s=1;}
  F(12,9,2,2+s,'#95a3b0');
  F(7,11+s,12,4,'#8a97a3');F(7,11+s,12,1,'#b7c3cd');F(7,14+s,12,1,'#58636e');
  F(9,15+s,8,1,'#58636e');
  F(1,26,24,6,m);F(1,26,24,1,hi);F(1,31,24,1,sh);
  F(8,23,10,3,'#6d7a87');F(8,23,10,1,'#95a3b0');
  if(p.st==='run'||p.st==='setup')F(5,22,16,1,'#c9d3da');
  if(p.st==='broken'&&Math.floor(t/250)%2){F(12,17,1,1,'#fff4c0');F(15,19,1,1,'#ffd05e');F(9,20,1,1,'#ffd05e');}
  if(p.st==='broken'){const f=(t/120)%6;F(4+f%3,-2-Math.floor(f/2),2,2,'#6d737a88');}
  // andon
  F(22,-7,3,9,'#0a0d10');
  const bl=Math.floor(t/400)%2===0;
  const on={run:[0,0,1],setup:[0,1,0],nomat:[0,bl,0],exped:[0,bl,0],broken:[bl,0,0],noop:[1,0,0]}[p.st]||[0,0,0];
  const LC=[['#ec5a50','#3a1614'],['#f2c230','#3a3010'],['#5cc26b','#15321a']];
  LC.forEach((cc,i)=>F(23,-6+i*3,1,2,on[i]?cc[0]:cc[1]));
  if(p.st==='pm')F(23,-6,1,8,bl?'#55a3e6':'#1a3550');
}

function rolo(F,cx,cy,r,ext,mid){const R=Math.ceil(r),furo=Math.max(0.8,r*0.24);
  for(let yy=-R;yy<=R;yy++)for(let xx=-R;xx<=R;xx++){const d2=xx*xx+yy*yy;if(d2>r*r)continue;const d=Math.sqrt(d2);let col;
    const luz=-(xx*0.8+yy)/r;
    if(d<=furo)col='#22272e';
    else if(d>=r-0.85)col=ext;
    else{col=luz>0.5?'#eef3f7':luz<-0.5?'#8996a1':mid;
      if(r>=4&&Math.floor((d-furo)*1.25)%2===1)col=luz>0.5?'#d3dce3':luz<-0.5?'#7a8692':'#a3afba';}
    if(r>=4&&xx===1&&yy<0&&d>furo&&d<r-0.85)col='#3f6fb5';
    F(cx+xx,cy+yy,1,1,col);}}
// pátio de bobinas na doca: piso demarcado, berços de madeira e bobinas empilhadas

// ================== CONFIGURAÇÃO ==================
// Endereço do Apps Script que grava as respostas (termina em /exec). Vazio = modo teste, guarda só no aparelho.
const ENVIO_URL = 'https://script.google.com/macros/s/AKfycbwiLznOS_QZDKPjZ-mr9LW5UVFypfAKD5f2VO-ozjkEwBJveuFn2vLPmPus1Glu-nSS/exec';
const FASE = 3, FASE_NOME = 'Ferramenteiro';
const KEY = 'sq2026-fase' + FASE;
// Perguntas da fase. O gabarito NÃO fica aqui: ele fica só na planilha de correção.
const PERGUNTAS = [
  {id:'F3P1', t:'O operador parou a prensa por um problema na ferramenta e apontou a parada no EGA. Você chegou para atender. O que fazer no EGA?',
   o:{a:'Nada, o operador já apontou a parada',b:'Entrar com o seu usuário e apontar a parada correta, de manutenção de ferramenta',c:'Pedir para o operador trocar o motivo da parada no fim do turno',d:'Apontar só quando o serviço terminar, com o tempo total'}},
  {id:'F3P2', t:'Você terminou o reparo na ferramenta e a prensa está pronta para voltar. O que fazer no EGA?',
   o:{a:'Retirar a parada de manutenção de ferramenta no EGA',b:'Deixar a parada aberta, o operador encerra quando voltar a produzir',c:'Encerrar a parada só no fim do turno, junto com os outros apontamentos',d:'Não precisa mexer, o EGA encerra sozinho quando a prensa volta a bater'}},
  {id:'F3P3', t:'Qual a diferença entre manutenção preventiva e corretiva de ferramenta?',
   o:{a:'São a mesma coisa, só muda o nome',b:'A preventiva é feita só quando o cliente reclama; a corretiva é feita todo mês',c:'A preventiva é planejada, feita antes da falha para evitá-la; a corretiva é feita depois que a falha aconteceu',d:'A preventiva é feita pelo operador; a corretiva, pelo ferramenteiro'}},
  {id:'F3P4', t:'Você terminou a preventiva da ferramenta e está tudo certo. O que falta?',
   o:{a:'Nada, se a ferramenta está boa a preventiva acabou',b:'Avisar o líder verbalmente que a preventiva foi feita',c:'Preencher o checklist da preventiva só se encontrou algum problema',d:'Preencher o checklist com as atividades realizadas'}},
  {id:'F3P5', t:'Você foi atender uma prensa parada e encontrou um punção quebrado. Para trocar, a ferramenta precisa sair da prensa e ir para a bancada. O que fazer?',
   o:{a:'Apontar a parada de manutenção de ferramenta no EGA e resolver ali mesmo, sem OS',b:'Tentar trocar o punção com a ferramenta montada para não perder tempo',c:'Problema maior: a produção abre a ordem de serviço e a ferramenta é encaminhada para o box da ferramentaria',d:'Levar a ferramenta para o box e abrir a OS só se o conserto passar do turno'}},
  {id:'F3P6', t:'Você terminou a corretiva e retirou a parada no EGA. O operador quer voltar a produzir na hora. O que precisa acontecer antes?',
   o:{a:'Nada, o ferramenteiro já testou a ferramenta',b:'O operador faz algumas peças e, se ficarem boas, segue a produção',c:'O ferramenteiro libera a produção assinando o checklist da preventiva',d:'Uma nova liberação da máquina pela qualidade, conforme o plano de controle'}},
  {id:'F3P7', t:'Ao atender a parada, você vê que o punção estava lascado e as últimas peças da caixa saíram com rebarba. O que fazer com essas peças?',
   o:{a:'Avisar a qualidade para tratar as peças como suspeitas',b:'Separar só as peças com rebarba visível e liberar o resto da caixa',c:'Rebarbar as peças você mesmo na bancada e devolver para a caixa',d:'Nada, peça é responsabilidade do operador e do inspetor'}},
  {id:'F3P8', t:'Antes de medir um punção novo, você pega um micrômetro na ferramentaria. O que conferir antes de usar?',
   o:{a:'Se ele está limpo, já que micrômetro não perde a calibração',b:'A etiqueta de calibração: código do instrumento e validade em dia',c:'Se o colega que usou antes mediu sem problema',d:'Se o zero bate, porque isso substitui a calibração'}}
];
const SETORES=['Produção','Logística','Manutenção','Ferramentaria','Qualidade','Engenharia','Administrativo','Outro'];

// ================== ESTADO E ENVIO ==================
let ST={jog:null,resp:{},cap:0,ini:0,fim:0};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)ST=r;}catch(e){}
const salvar=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}};
function enviar(dados){
  if(!/^https:\/\//.test(ENVIO_URL))return;
  const corpo=JSON.stringify({...dados,fase:FASE,matricula:ST.jog.matricula,nome:ST.jog.nome,setor:ST.jog.setor,ts:new Date().toISOString()});

// ================== TELAS ==================
function telaInicio(){
  CENA='planta';
  abrir(`<div class="tag">Semana da Qualidade · 9 a 13 de novembro</div><h2>Fase 3 · Ferramenteiro</h2>
    <p class="muted">Um turno como ferramenteiro, com a Laryssa do RH. Leva uns 10 minutos. No fim do turno, uma avaliação com 8 situações do dia a dia.</p>
    <label for="fnome">Nome completo</label><input id="fnome" autocomplete="name" maxlength="60">
    <div class="grid2"><div><label for="fmat">Matrícula</label><input id="fmat" inputmode="numeric" maxlength="12"></div>
    <div><label for="fset">Setor</label><select id="fset"><option value="">Escolha</option>${SETORES.map(s=>`<option>${s}</option>`).join('')}</select></div></div>
    <p class="tiny">Seus dados são usados só para registrar as respostas da Semana da Qualidade e selecionar quem vai para o quiz de sexta.</p>
    <button class="btn wide" id="ini">Começar</button>${/^https:\/\//.test(ENVIO_URL)?'':'<p class="tiny">Modo teste: as respostas ficam só neste aparelho.</p>'}`);
  // quem já jogou a fase anterior não precisa digitar de novo
  try{const f1=['sq2026-fase2','sq2026-fase1','sq2026-fase4'].map(k=>JSON.parse(localStorage.getItem(k)||'null')).find(x=>x&&x.jog);if(f1){$('#fnome').value=f1.jog.nome;$('#fmat').value=f1.jog.matricula;$('#fset').value=f1.jog.setor;}}catch(e){}
  $('#ini').onclick=()=>{const nome=$('#fnome').value.trim(),mat=$('#fmat').value.trim(),set=$('#fset').value;
    if(nome.length<3||!mat||!set){$('#ini').textContent='Preencha nome, matrícula e setor';return;}
    ST={jog:{nome,matricula:mat,setor:set},resp:{},cap:0,ini:Date.now(),fim:0};salvar();fechar();iniciar();};
}
async function iniciar(){
  montarElenco();atualizarProg();reenviarPendentes();
  if(ST.cap>0){await falar(`Bem-vindo de volta, <b>{nome}</b>! Vamos continuar de onde você parou.`);}
  for(let i=ST.cap;i<CAP.length;i++){await CAP[i]();ST.cap=i+1;salvar();}
  if(!ST.fim){ST.fim=Date.now();salvar();enviar({tipo:'conclusao',tempo_s:Math.round((ST.fim-ST.ini)/1000)});}
  telaFim();
}
function codigo(){return (hash(ST.jog.matricula+'|'+FASE+'|'+ST.fim).toString(36).toUpperCase()+'0000').slice(0,6);}
function telaFim(){
  CENA='montadora';
  const min=Math.max(1,Math.round((ST.fim-ST.ini)/60000));
  escrever('Fase 3 concluída! Obrigada pelo turno, {nome}. Amanhã às 18h tem a <b>Fase 4: Inspetor de qualidade</b>.'.replace('{nome}',primeiro()));

    <p class="muted">Suas ${Object.keys(ST.resp).length} respostas foram registradas. O resultado sai na sexta de manhã, e as 5 pessoas com mais acertos vão para o quiz ao vivo na sexta.</p>

    ${(/^https:\/\//.test(ENVIO_URL)&&!(STATUS&&STATUS.teste))?'':`<p class="tiny">Modo teste</p><div class="grid2"><button class="btn ghost" id="vreg">Ver registro</button><button class="btn ghost" id="zerar">Recomeçar teste</button></div>`}`);

requestAnimationFrame(t=>{ult=t;loop(t);});

// ---------- a planilha diz se a fase está aberta ----------
let STATUS=null;
async function consultarStatus(){
  if(!/^https:\/\//.test(ENVIO_URL))return null;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(ENVIO_URL+'?acao=status',{signal:ctl.signal});clearTimeout(tm);
    STATUS=await r.json();return (STATUS.fases||[]).find(f=>f.fase===FASE)||null;}catch(e){return null;}
}
const quando=iso=>new Date(iso).toLocaleString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'America/Recife'});
async function abrirJogo(){
  if(/^https:\/\//.test(ENVIO_URL))abrir('<div class="ok"><h2>Carregando…</h2></div>');
  const f=await consultarStatus();
  if(ST.jog&&ST.fim){montarElenco();telaFim();return;}
  if(f&&f.estado==='antes'){
    abrir(`<div class="tag">Semana da Qualidade · 9 a 13 de novembro</div><h2>Fase ${FASE} · ${FASE_NOME}</h2><p class="muted">Esta fase ainda não começou. Ela abre <b>${quando(f.abre)}</b>.</p><button class="btn wide" id="tn">Tentar de novo</button>`);
    $('#tn').onclick=()=>location.reload();return;}
  if(f&&f.estado==='encerrada'){
    abrir(`<div class="tag">Semana da Qualidade · 9 a 13 de novembro</div><h2>Fase ${FASE} · ${FASE_NOME}</h2><p class="muted">Esta fase foi encerrada ${quando(f.fecha)}. O resultado sai na sexta de manhã.</p>`);return;}
  fechar();
  if(!ST.jog)telaInicio();else iniciar();
}
abrirJogo();
